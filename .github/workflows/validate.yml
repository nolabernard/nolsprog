name: Validate NolsProg
on:
  push:
    branches: [main, 'feature/onboarding-coherence-guide']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check interactive sessions
        run: node scripts/smoke.cjs
      - name: Validate sports rules phase 1
        run: node scripts/sport-rules.test.cjs
      - name: Validate generator integration phase 2
        run: node scripts/sport-engine-integration.test.cjs
      - name: Audit sports quality phase 4
        run: node scripts/sport-quality.test.cjs
      - name: Validate calendar integration
        run: node scripts/calendar-integration.test.cjs
      - name: Test double progression and RIR
        run: node scripts/sport-progression.test.cjs
      - name: Validate visual identity
        run: node scripts/visual-identity.test.cjs
      - name: Test personalized coherence guide
        run: node scripts/sport-guide.test.cjs
      - name: Verify required files
        run: test -s index.html && test -s app.js && test -s styles.css && test -s manifest.webmanifest
